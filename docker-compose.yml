services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: veridian-it-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./veridian.db
      - JWT_SECRET=veridian-local-dev-secret-2026
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=480
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=admin123
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 3
    networks:
      - veridian-net

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: veridian-it-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - veridian-net

networks:
  veridian-net:
    driver: bridge
